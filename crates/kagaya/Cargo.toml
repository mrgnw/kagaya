[package]
name = "kagaya"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "launchd made easy — register projects as services, manage them with start/stop/restart/status/logs"
readme = "README.md"
keywords = ["launchd", "process-manager", "daemon", "macos", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ky"
path = "src/bin/kagaya/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
nix = { workspace = true }

# CLI binary dependencies
muzan = { workspace = true }
koku = { version = "0.1.0", path = "../../../koku" }
toml = { workspace = true }
axum = { workspace = true }
owo-colors = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
clap = { workspace = true }
plist = { workspace = true }
rust-embed = { version = "8", features = ["axum"] }
mime_guess = "2"
tabwriter = "1.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"

[dependencies.listeners]
version = "0.4"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
